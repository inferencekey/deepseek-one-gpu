.cpu{fill:#0969da}.cpus{stroke:#0969da}.cpuw{fill:#ddf4ff}
.amb{fill:#9a6700}.ambs{stroke:#9a6700}.ambw{fill:#fff8c5}
.api{fill:#8250df}.apis{stroke:#8250df}.apiw{fill:#fbefff}
.cover{fill:#f6f8fa}
