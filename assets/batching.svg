<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="title">Batch slots versus one request at a time</title>
<desc id="desc">One request at a time: 63.11 tok/s in total, the other users wait. With 4 batch slots each decode step makes a token for every user: 127.58 tok/s in total (2.02x), 31.87 tok/s for the slowest user, so the 4 replies finish in about half the time.</desc>
