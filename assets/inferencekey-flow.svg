.panel{fill:#f6f8fa;stroke:#d0d7de}
.card{fill:#ffffff;stroke:#d0d7de}
.t{fill:#1f2328}
.m{fill:#59636e}
.f{fill:#818b98}
.line{stroke:#d0d7de}
.gpu{fill:#1a7f37}.gpus{stroke:#1a7f37}.gpuw{fill:#dafbe1}
.cpu{fill:#0969da}.cpus{stroke:#0969da}.cpuw{fill:#ddf4ff}
.amb{fill:#9a6700}.ambs{stroke:#9a6700}.ambw{fill:#fff8c5}
.api{fill:#8250df}.apis{stroke:#8250df}.apiw{fill:#fbefff}
.pkt{fill:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.panel{fill:#161b22;stroke:#30363d}
.card{fill:#0d1117;stroke:#30363d}
.t{fill:#e6edf3}
.m{fill:#9198a1}
.f{fill:#6e7681}
.line{stroke:#30363d}
.gpu{fill:#3fb950}.gpus{stroke:#3fb950}.gpuw{fill:#0f2d1a}
.cpu{fill:#4493f8}.cpus{stroke:#4493f8}.cpuw{fill:#0c2440}
.amb{fill:#d29922}.ambs{stroke:#d29922}.ambw{fill:#2e2306}
.api{fill:#ab7df8}.apis{stroke:#ab7df8}.apiw{fill:#2a1a45}
.pkt{fill:#0d1117}
}
.flow{stroke-dasharray:5 7;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.s1{animation:s1 14s linear infinite}
@keyframes s1{0%,2%{opacity:.35}4%,22%{opacity:1}24%,100%{opacity:.35}}
.s2{animation:s2 14s linear infinite}
@keyframes s2{0%,24%{opacity:.35}26%,52%{opacity:1}54%,100%{opacity:.35}}
.s3{animation:s3 14s linear infinite}
@keyframes s3{0%,54%{opacity:.35}56%,98%{opacity:1}100%{opacity:.35}}
.p1{opacity:0;animation:p1 14s ease-in-out infinite}
@keyframes p1{0%,3%{opacity:0;transform:none}4%{opacity:1;transform:none}18%{opacity:1;transform:translateX(125px)}19%,100%{opacity:0;transform:translateX(125px)}}
.p2{opacity:0;animation:p2 14s ease-in-out infinite}
@keyframes p2{0%,26%{opacity:0;transform:none}27%{opacity:1;transform:none}35%{opacity:1;transform:translateX(125px)}36%,100%{opacity:0;transform:translateX(125px)}}
.p3{opacity:0;animation:p3 14s ease-in-out infinite}
@keyframes p3{0%,37%{opacity:0;transform:none}38%{opacity:1;transform:none}47%{opacity:1;transform:translateX(125px)}48%,100%{opacity:0;transform:translateX(125px)}}
.p4{opacity:0;animation:p4 14s ease-in-out infinite}
@keyframes p4{0%,57%{opacity:0;transform:none}58%{opacity:1;transform:none}65%{opacity:1;transform:translateX(125px)}66%,100%{opacity:0;transform:translateX(125px)}}
.p6{opacity:0;animation:p6 14s ease-in-out infinite}
@keyframes p6{0%,66%{opacity:0;transform:none}67%{opacity:1;transform:none}74%{opacity:1;transform:translateX(125px)}75%,100%{opacity:0;transform:translateX(125px)}}
.p5{opacity:0;animation:p5 14s ease-in-out infinite}
@keyframes p5{0%,80%{opacity:0;transform:none}81%{opacity:1;transform:none}88%{opacity:1;transform:translateX(-125px)}89%,100%{opacity:0;transform:translateX(-125px)}}
.p7{opacity:0;animation:p7 14s ease-in-out infinite}
@keyframes p7{0%,89%{opacity:0;transform:none}90%{opacity:1;transform:none}97%{opacity:1;transform:translateX(-125px)}98%,100%{opacity:0;transform:translateX(-125px)}}
.busy{animation:busy 14s ease-in-out infinite}
@keyframes busy{0%,74%{opacity:.45}76%,79%{opacity:1}81%,100%{opacity:.45}}
.setup{animation:setup 14s ease-in-out infinite}
@keyframes setup{0%,46%{opacity:.45}48%,54%{opacity:1}56%,100%{opacity:.45}}
