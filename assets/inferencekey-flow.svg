<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="title">Using deepseek-one-gpu from InferenceKey</title>
<desc id="desc">Three steps. 1: from your laptop, publish.py uploads the custom backend to InferenceKey. 2: main.py calls ensure(); InferenceKey assigns the workload to your private worker, whose backend downloads the engine and the model and starts the server. 3: your OpenAI client sends a chat request to the InferenceKey endpoint, which passes it to the worker; the RTX PRO 6000 and the host's CPU compute the reply, which goes back the same way. Measured on this engine: 63.11 tok/s for 1 user, 127.58 tok/s for 4 users at once.</desc>
<style>
