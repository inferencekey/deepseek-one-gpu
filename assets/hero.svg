<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="title">deepseek-one-gpu</title>
<desc id="desc">DeepSeek-V4.1-Flash served from one 96 GB RTX PRO 6000 plus host RAM: 63.11 tok/s for one user, 127.58 tok/s for 4 users, 152.53 tok/s for 8 users. Hot experts live in VRAM and swap with the experts in host RAM.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.panel{fill:#f6f8fa;stroke:#d0d7de}
.t{fill:#1f2328}
.m{fill:#59636e}
.f{fill:#818b98}
.line{stroke:#d0d7de}
.grid{stroke:#eaeef2}
.gpu{fill:#1a7f37}.gpus{stroke:#1a7f37}.gpuw{fill:#dafbe1}
.cpu{fill:#0969da}.cpus{stroke:#0969da}.cpuw{fill:#ddf4ff}
.amb{fill:#9a6700}.ambs{stroke:#9a6700}.ambw{fill:#fff8c5}
.api{fill:#8250df}.apis{stroke:#8250df}.apiw{fill:#fbefff}
.cover{fill:#f6f8fa}
