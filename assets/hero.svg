.api{fill:#ab7df8}.apis{stroke:#ab7df8}.apiw{fill:#2a1a45}
.cover{fill:#161b22}
}

.in{animation:up .9s ease-out both}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
.d4{animation-delay:.8s}.d5{animation-delay:.95s}.d6{animation-delay:1.1s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}
.flow{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.sa{transform:translate(0px,-70px);animation:sa 6s ease-in-out infinite}
@keyframes sa{0%,15%{transform:none}45%,90%{transform:translate(0px,-70px)}100%{transform:translate(0px,-70px)}}
.saf{animation:saf 6s ease-in-out infinite}
@keyframes saf{0%,15%{fill:#9a6700}45%,100%{fill:#1a7f37}}
.sb{transform:translate(0px,70px);animation:sb 6s ease-in-out infinite}
@keyframes sb{0%,15%{transform:none}45%,100%{transform:translate(0px,70px)}}
.sbf{opacity:.55;animation:sbf 6s ease-in-out infinite}
@keyframes sbf{0%,15%{fill:#1a7f37;opacity:1}45%,100%{fill:#0969da;opacity:.55}}
@media (prefers-color-scheme: dark){
@keyframes saf{0%,15%{fill:#d29922}45%,100%{fill:#3fb950}}
@keyframes sbf{0%,15%{fill:#3fb950;opacity:1}45%,100%{fill:#4493f8;opacity:.55}}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
